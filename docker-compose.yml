version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: churn-backend
    # Keep FastAPI strictly INTERNAL: accessible only within churn-network
    expose:
      - "8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./logs:/app/logs
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    networks:
      - churn-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: churn-frontend
    # Expose Streamlit to host / external public traffic
    ports:
      - "8501:8501"
    environment:
      # Communicate with FastAPI using Docker Compose service DNS name
      - API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - churn-network
    restart: unless-stopped

networks:
  churn-network:
    driver: bridge
